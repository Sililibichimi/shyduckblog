<header class="site-header">
  <a class="brand" href="{{ site.Home.RelPermalink }}">
    <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><path class="s-accent" d="M14 6 A 15 15 0 1 0 34 26 A 12 12 0 1 1 14 6 Z" filter="url(#rough)"></path></svg>
    <span class="hand">{{ site.Title }}</span>
  </a>
  <div class="header-right">
    <nav aria-label="Điều hướng chính">
      <ul class="nav">
        {{ $page := . }}
        {{ range site.Menus.main }}
          {{ $active := or ($page.IsMenuCurrent "main" .) ($page.HasMenuCurrent "main" .) }}
          {{ if and (eq .PageRef "/writing") (in site.Params.mainSections $page.Section) }}{{ $active = true }}{{ end }}
          <li><a href="{{ .URL }}"{{ if $active }} class="is-active" aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </nav>
  </div>
</header>
